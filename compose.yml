services:
  api:
    mem_limit: "${API_MEM_LIMIT:-2g}"
    user: "1000:1000"
    depends_on:
      voicevox-worker:
        condition: service_healthy
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    ports:
      - "${PORT:-9111}:${PORT:-9111}"
    environment:
      # Genie
      GENIE_ENV: "${GENIE_ENV:-dev}"
      HOST: "${HOST:-0.0.0.0}"
      PORT: "${PORT:-9111}"
      QUERY_DB_MEMORY_BUDGET_MB: "${QUERY_DB_MEMORY_BUDGET_MB:-256}"
      QUERY_DB_ESTIMATED_BYTES_PER_POINT: "${QUERY_DB_ESTIMATED_BYTES_PER_POINT:-256}"
      VOICEVOX_URL: "http://voicevox-worker:9120"
      VOICEVOX_ENABLED: "${VOICEVOX_ENABLED:-true}"

      # IMPORTANT: In Docker + bind-mount environments (especially on WSL/Windows),
      # Revise/AutoReload can trigger continuous re-inference/recompile loops.
      # This manifests as ~100% CPU burn even when the server is "idle".
      JULIA_REVISE: "off"
      GENIE_AUTORELOAD: "false"
      GENIE_AUTO_RELOAD: "false"
      JULIA_DEPOT_PATH: "/julia_depot"
      # Optional: keep idle behavior predictable
      JULIA_NUM_THREADS: "${JULIA_NUM_THREADS:-1}"
      # supercollider
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox"
      QT_QPA_PLATFORM: "minimal"
      QT_OPENGL: "software"
      LIBGL_ALWAYS_SOFTWARE: "1"
    # Mount ONLY backend sources to avoid unnecessary file scanning/invalidation.
    # We do NOT mount bin/ to avoid Windows/WSL losing executable bits.
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./bootstrap.jl:/app/bootstrap.jl
      - ./routes.jl:/app/routes.jl
      - ./Project.toml:/app/Project.toml
      - ./Manifest.toml:/app/Manifest.toml
      - ./scripts/start_server.jl:/app/scripts/start_server.jl
      - ./data/asap-dataset:/app/data/asap-dataset:ro
    command: ["julia", "--project=.", "scripts/start_server.jl"]

  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    ports:
      - "${VOICEVOX_PORT:-50021}:50021"
    expose:
      - "50021"

  voicevox-worker:
    build:
      context: .
      dockerfile: voicevox_worker/Dockerfile
    environment:
      VOICEVOX_ENGINE_URL: "http://voicevox:50021"
      VOICEVOX_SPEAKER: "${VOICEVOX_SPEAKER:-2}"
      VOICEVOX_RENDER_MODE: "${VOICEVOX_RENDER_MODE:-sing}"
      VOICEVOX_SINGING_TEACHER: "${VOICEVOX_SINGING_TEACHER:-6000}"
      VOICEVOX_SINGER: "${VOICEVOX_SINGER:-3003}"
      VOICEVOX_WORKER_PORT: "9120"
    depends_on:
      - voicevox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9120/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    working_dir: /app
    depends_on:
      - api
    ports:
      - "5173:5173"
    environment:
      # File watching in Docker/WSL is often unreliable without polling
      CHOKIDAR_USEPOLLING: "true"

      # If you use proxy in Vite config, this can be referenced
      VITE_API_TARGET: "http://api:${PORT:-9111}"

      # Frontend toggle: run generate_polyphonic on GitHub Actions or hosting server
      VITE_RUN_GENERATE_POLYPHONIC_ON_GITHUB_ACTIONS: "${RUN_GENERATE_POLYPHONIC_ON_GITHUB_ACTIONS:-true}"
      VITE_VOICEVOX_ENABLED: "${VOICEVOX_ENABLED:-true}"

    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules

    command:
      - bash
      - -lc
      - |
        if [ ! -d node_modules ] || [ -z "$(ls -A node_modules 2>/dev/null)" ]; then
          npm ci
        fi
        exec npm run dev -- --host 0.0.0.0 --port 5173

  influxdb:
    image: influxdb:1.8
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb
    environment:
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 10s
      retries: 5
  influx_init:
    user: "1000:1000"
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    depends_on:
      - influxdb
    volumes:
      - ./scripts/seed_influx.jl:/app/scripts/seed_influx.jl
      - ./data/asap-dataset:/app/data/asap-dataset:ro
    command:
      - bash
      - -lc
      - |
        if [[ "${SEED_ON_START:-false}" == "true" ]]; then
          exec /usr/local/julia/bin/julia --project=. scripts/seed_influx.jl
        fi
        echo "[influx_init] skipped: SEED_ON_START=${SEED_ON_START:-unset}"

volumes:
  web_node_modules:
  influxdb_data:
