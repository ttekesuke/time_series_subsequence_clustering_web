name: issue14-step-atomic-patch

on:
  push:
    branches:
      - fix/issue-14-transaction-safety

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[issue14-step-atomic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-14-transaction-safety
          fetch-depth: 0
      - name: Apply controller patch
        run: python3 .github/issue14_step_patch.py
      - name: Commit controller patch and remove one-shot files
        run: |
          rm .github/issue14_step_patch.py .github/workflows/issue14-step-atomic-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/controllers/time_series_controller.jl .github/issue14_step_patch.py .github/workflows/issue14-step-atomic-patch.yml
          git diff --cached --check
          git commit -m "[issue14-step-atomic] stage complete generate_polyphonic steps"
          git push origin HEAD:fix/issue-14-transaction-safety
