name: issue14-context-fix-v2

on:
  push:
    branches:
      - fix/issue-14-transaction-safety

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[issue14-context-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-14-transaction-safety
          fetch-depth: 0
      - name: Preserve dimension in candidate failure context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/controllers/time_series_controller.jl')
          s = p.read_text()
          start = s.index('function select_best_values_for_dimension_greedy(')
          end = s.index('\n# ------------------------------------------------------------\n# generate_polyphonic (main)', start)
          region = s[start:end]
          old = '''          operation="simulate_candidate",
          stream_id=(stream_idx <= length(actives) ? actives[stream_idx].id : nothing),
          candidate=float(cand),
'''
          new = '''          operation="simulate_candidate",
          dimension=get(trace_context, :dimension, nothing),
          stream_id=(stream_idx <= length(actives) ? actives[stream_idx].id : nothing),
          candidate=float(cand),
'''
          if region.count(old) != 1:
              raise SystemExit(f'expected one greedy trace block, found {region.count(old)}')
          region = region.replace(old, new, 1)
          p.write_text(s[:start] + region + s[end:])
          PY
      - name: Commit fix and remove one-shot workflows
        run: |
          rm .github/workflows/issue14-context-fix.yml
          rm .github/workflows/issue14-context-fix-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/controllers/time_series_controller.jl .github/workflows/issue14-context-fix.yml .github/workflows/issue14-context-fix-v2.yml
          git diff --cached --check
          git commit -m "[issue14-context-fixed] preserve generation failure dimension"
          git push origin HEAD:fix/issue-14-transaction-safety
