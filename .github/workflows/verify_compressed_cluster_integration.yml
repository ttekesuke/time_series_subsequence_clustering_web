name: Verify Compressed Cluster Integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11.6"
      - uses: julia-actions/cache@v2
      - name: Instantiate
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run all backend regression tests
        run: julia --project=. test/runtests.jl
      - name: Verify backend runner rejects a failed test
        run: |
          echo 'using Test; @test false' > test/__ci_failure_probe.jl
          if julia --project=. test/runtests.jl __ci_failure_probe.jl; then
            echo 'The backend test runner accepted a failing test'
            exit 1
          fi
          rm test/__ci_failure_probe.jl
      - name: Measure generation stream commits
        run: julia --project=. scripts/benchmark_generation_staging.jl
      - name: Measure MusicXML event indexing (bounded fixture)
        run: julia --project=. scripts/benchmark_music_event_index.jl

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run build

  voicevox-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run VOICEVOX worker HTTP tests
        run: python3 -m unittest discover -s voicevox_worker -p 'test_*.py'

  analyse-music-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11.6"
      - uses: julia-actions/cache@v2
      - name: Instantiate
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Verify MusicAnalyse HTTP JSON response
        run: python3 scripts/smoke_analyse_music_http.py
