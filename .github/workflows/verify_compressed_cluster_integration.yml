name: Verify Compressed Cluster Integration

on:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11.6"
      - uses: julia-actions/cache@v2
      - name: Instantiate
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run compressed cluster integration suite
        run: |
          julia --project=. -e '
            ENV["GENIE_ENV"]="test";
            using Genie;
            Genie.loadapp();
            for file in [
              "test/polyphonic_compression_equivalence.jl",
              "test/cluster_storage_encapsulation.jl",
              "test/predictive_complexity.jl",
              "test/occurrence_interval_complexity.jl",
              "test/metric_calibration_and_chord_greedy.jl",
              "test/transaction_safety.jl",
              "test/issues_16_23_regressions.jl",
              "test/issues_18_lifecycle_regression.jl",
              "test/generate_polyphonic_validation.jl",
              "test/voice_token_generation.jl",
              "test/analyse_music.jl",
              "test/tie_rendering.jl",
              "test/normalize_octave_invariance.jl",
            ]
              println("=== ", file, " ===");
              include(file);
            end
          '
      - name: Benchmark MusicAnalyse-like 1728-step stream
        run: |
          julia --project=. <<'JULIA'
          ENV["GENIE_ENV"]="test"
          using Genie
          Genie.loadapp()
          P = Main.TimeseriesClusteringAPI.PolyphonicClusterManager
          TC = Main.TimeseriesClusteringAPI.TimeSeriesController

          data = [Float64[60 + mod(div(i - 1, 8), 12)] for i in 1:1728]
          mgr = P.Manager(
            deepcopy(data[1:2]),
            0.02,
            2,
            false;
            range_min=0.0,
            range_max=127.0,
            max_set_size=1,
            enable_occurrence_intervals=true,
          )
          P.process_data!(mgr)
          P.update_caches_permanently!(mgr)

          GC.gc()
          elapsed = @elapsed begin
            for value in data[3:end]
              TC.evaluate_observed_complexity!(mgr, copy(value))
            end
          end
          P.finalize_cluster_storage!(mgr)

          function span_count(spans)
            total = length(spans)
            for span in spans
              total += span_count(span.children)
            end
            total
          end

          println("MUSIC_ANALYSE_1728_ELAPSED_S=", round(elapsed; digits=3))
          println("MUSIC_ANALYSE_1728_LOGICAL_NODES=", length(P.logical_virtual_nodes(mgr)))
          println("MUSIC_ANALYSE_1728_PHYSICAL_SPANS=", span_count(mgr.cluster_spans))
          JULIA

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
