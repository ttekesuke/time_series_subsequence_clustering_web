name: Verify Music Analyse Window Cap

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11.6"
      - uses: julia-actions/cache@v2
      - name: Instantiate
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run analyse_music tests
        run: julia --project=. -e 'ENV["GENIE_ENV"]="test"; using Genie; Genie.loadapp(); include("test/analyse_music.jl")'
      - name: Benchmark capped 1728-step stream
        run: |
          julia --project=. -e '
            ENV["GENIE_ENV"]="test";
            using Genie;
            Genie.loadapp();
            MA = Main.TimeseriesClusteringAPI.MusicAnalysis;
            TC = Main.TimeseriesClusteringAPI.TimeSeriesController;
            Config = Main.TimeseriesClusteringAPI.Config;
            series = [Float64[60 + mod(div(i, 8), 12)] for i in 1:1728];
            started = time();
            result = MA._analyse_manager(
              series,
              TC;
              range_min=0.0,
              range_max=127.0,
              merge_threshold_ratio=0.02,
              metric_weights=Config.POLYPHONIC_STREAM_METRIC_WEIGHTS,
              max_window_size=Config.MUSIC_ANALYSIS_MAX_CLUSTER_WINDOW_SIZE,
              log_label="benchmark/1728",
            );
            elapsed = time() - started;
            windows = Int[Int(x["window_size"]) for x in result["clusters"]];
            @assert isempty(windows) || maximum(windows) <= Config.MUSIC_ANALYSIS_MAX_CLUSTER_WINDOW_SIZE;
            println("BENCHMARK_ELAPSED_SECONDS=", round(elapsed; digits=3));
            println("BENCHMARK_CLUSTER_COUNT=", length(result["clusters"]));
          '
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
