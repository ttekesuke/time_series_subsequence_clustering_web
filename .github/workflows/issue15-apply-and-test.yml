name: issue15-apply-and-test

on:
  push:
    branches:
      - fix/issue-15-input-budget

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-15-input-budget
          fetch-depth: 0

      - name: Apply guarded patch
        run: |
          python3 .github/issue15_patch.py
          git diff --check

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11.6'

      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run validation and budget regression tests
        run: |
          julia --project=. -e '
            ENV["GENIE_ENV"] = "test"
            push!(LOAD_PATH, abspath("src"))
            using Genie
            Genie.loadapp()
            using Main.TimeseriesClusteringAPI, Test
            include("test/generate_polyphonic_validation.jl")
          '

      - name: Verify HTTP 422 at direct and dispatch endpoints
        env:
          PORT: '9115'
          HOST: '127.0.0.1'
          GENIE_ENV: test
          CLUSTERING_QUERY_ENABLED: 'false'
          STARTUP_WARMUP_ENABLED: 'false'
          POLYPHONIC_MAX_FUTURE_STEPS: '2'
        run: |
          set -euo pipefail
          julia --project=. scripts/start_server.jl >/tmp/issue15-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/issue15-server.log' EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9115/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1

          check_422() {
            endpoint="$1"
            payload="$2"
            body_file=$(mktemp)
            status=$(curl -sS -o "$body_file" -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              "http://127.0.0.1:9115${endpoint}")
            cat "$body_file"
            echo
            test "$status" = 422
            grep -q 'invalid_generate_polyphonic_request' "$body_file"
            rm -f "$body_file"
          }

          check_422 '/api/web/time_series/generate_polyphonic' '{"generate_polyphonic":{"stream_counts":[]}}'
          check_422 '/api/web/time_series/generate_polyphonic' '{"generate_polyphonic":{"stream_counts":[1,1,1]}}'
          check_422 '/api/web/time_series/generate_polyphonic' '{"generate_polyphonic":{"stream_counts":[1],"initial_context":[[[[35],1,0.5,0.2,1,0.1,0.4,0.5,0,0,0]]]}}'
          check_422 '/api/web/time_series/dispatch_generate_polyphonic' '{"generate_polyphonic":{"stream_counts":[]}}'

      - name: Commit verified fix and remove one-shot files
        run: |
          rm -f .github/issue15_patch.py .github/workflows/issue15-apply-and-test.yml
          git diff --check
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: validate and budget generate_polyphonic requests'
          git push origin HEAD:fix/issue-15-input-budget
