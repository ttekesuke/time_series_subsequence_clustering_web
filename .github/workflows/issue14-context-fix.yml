name: issue14-context-fix

on:
  push:
    branches:
      - fix/issue-14-transaction-safety

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-14-transaction-safety
          fetch-depth: 0
      - name: Preserve dimension in candidate failure context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/controllers/time_series_controller.jl')
          s = p.read_text()
          old = '''          operation="simulate_candidate",
          stream_id=(stream_idx <= length(actives) ? actives[stream_idx].id : nothing),
          candidate=float(cand),
'''
          new = '''          operation="simulate_candidate",
          dimension=get(trace_context, :dimension, nothing),
          stream_id=(stream_idx <= length(actives) ? actives[stream_idx].id : nothing),
          candidate=float(cand),
'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one greedy trace block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/issue14-context-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/controllers/time_series_controller.jl .github/workflows/issue14-context-fix.yml
          git diff --cached --check
          git commit -m "fix: preserve dimension in generation failure context"
          git push origin HEAD:fix/issue-14-transaction-safety
