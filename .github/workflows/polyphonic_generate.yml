name: Polyphonic Generate (Artifacts)
run-name: polyphonic-${{ inputs.request_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Client request/job id (optional, for traceability)"
        required: false
        type: string
      params_b64:
        description: "Base64-encoded gzip JSON payload for /api/web/time_series/generate_polyphonic"
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GENIE_ENV: prod
      GENIE_HOST: 127.0.0.1
      GENIE_PORT: "9111"
      PORT: "9111"
      JULIA_NUM_THREADS: "auto"
      VOICEVOX_ENABLED: "true"
      VOICEVOX_URL: "http://127.0.0.1:9120"
      # 500-step Song renders can exceed the interactive 300-second default.
      SC_RENDER_TIMEOUT_SECONDS: "1800"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.11.6"

      - name: Julia cache
        uses: julia-actions/cache@v2

      - name: Instantiate & precompile
        run: |
          set -eux
          julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Install SuperCollider
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y supercollider

      - name: Start VOICEVOX Song services
        shell: bash
        run: |
          set -euxo pipefail
          docker run -d --name voicevox-engine -p 50021:50021 \
            voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          docker build -t local-voicevox-worker -f voicevox_worker/Dockerfile .
          docker run -d --name voicevox-worker --network host \
            -e VOICEVOX_ENGINE_URL=http://127.0.0.1:50021 \
            -e VOICEVOX_SPEAKER=2 \
            -e VOICEVOX_RENDER_MODE=sing \
            -e VOICEVOX_SINGING_TEACHER=6000 \
            -e VOICEVOX_SINGER=3003 \
            -e VOICEVOX_WORKER_PORT=9120 \
            local-voicevox-worker
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:9120/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9120/health >/dev/null

      - name: Decode params
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ inputs.params_b64 }}' | base64 -d > params.payload
          if gzip -t params.payload 2>/dev/null; then
            gzip -dc params.payload > params.json
          else
            # Backward compatibility for runs dispatched by an older API.
            cp params.payload params.json
          fi
          rm params.payload
          echo "params.json written: $(wc -c < params.json) bytes"

      - name: Start API server
        shell: bash
        run: |
          set -euxo pipefail

          julia --project=. scripts/start_server.jl > server.log 2>&1 &
          echo $! > server.pid

          for i in $(seq 1 600); do
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              echo "Server process exited early"
              echo "==== server.log (tail) ===="
              tail -n 300 server.log || true
              exit 1
            fi

            code="$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:${GENIE_PORT}/api/health || true)"
            if [ "$code" = "200" ]; then
              echo "Server is ready (HTTP 200)"
              break
            fi

            if (( i % 10 == 0 )); then
              echo "waiting... ${i}s (last HTTP: ${code})"
              tail -n 50 server.log || true
              echo "----"
            fi

            sleep 1
          done

          code="$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:${GENIE_PORT}/api/health || true)"
          if [ "$code" != "200" ]; then
            echo "Server did not become ready in time (last HTTP: ${code})"
            echo "==== ss -ltnp ===="
            ss -ltnp || true
            echo "==== server.log (tail) ===="
            tail -n 300 server.log || true
            exit 1
          fi

      - name: Warmup generate_polyphonic (short params)
        shell: bash
        run: |
          set -euxo pipefail
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            --data-binary @config/warmup_generate_polyphonic.json \
            http://127.0.0.1:${GENIE_PORT}/api/web/time_series/generate_polyphonic \
            > /tmp/warmup_result.json

      - name: Generate polyphonic result.json
        shell: bash
        run: |
          set -euxo pipefail
          touch server.log
          tail -n 0 -f server.log &
          tail_pid=$!
          cleanup() { kill "$tail_pid" 2>/dev/null || true; }
          trap cleanup EXIT

          response_status="$(curl -sS -o result.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            --data-binary @params.json \
            http://127.0.0.1:${GENIE_PORT}/api/web/time_series/generate_polyphonic)"
          cleanup
          trap - EXIT

          if [[ "${response_status}" != 2* ]]; then
            echo "generate_polyphonic returned HTTP ${response_status}" >&2
            cat result.json >&2
            echo "==== server.log (tail) ====" >&2
            tail -n 300 server.log >&2 || true
            exit 1
          fi

          python3 - <<'PY'
          import json
          obj=json.load(open('result.json','r',encoding='utf-8'))
          if 'timeSeries' not in obj:
              print('generate_polyphonic response:', json.dumps(obj, ensure_ascii=False), flush=True)
              raise AssertionError('missing timeSeries in response')
          print('timeSeries length:', len(obj['timeSeries']))
          PY

      - name: Render wav (decode audio_data)
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, base64, math, urllib.request
          result = json.load(open('result.json','r',encoding='utf-8'))
          params = json.load(open('params.json','r',encoding='utf-8'))
          gp = params.get('generate_polyphonic', params)
          bpm_raw = result.get('bpm', gp.get('bpm', 240))
          try:
            bpm = float(bpm_raw)
          except Exception:
            bpm = 240.0
          if (not math.isfinite(bpm)) or bpm <= 0:
            bpm = 240.0
          req = {
            'time_series': result['timeSeries'],
            'stream_ids': result.get('streamIds', []),
            'voice_plan': result.get('voicePlan', []),
            'note_chords_pitch_classes': result.get('noteChordsPitchClasses', []),
            'bpm': bpm,
            'future_bpm': result.get('bpmSeries', gp.get('future_bpm', [])),
          }
          print('render bpm:', bpm)
          data = json.dumps(req).encode('utf-8')
          http_req = urllib.request.Request(
            'http://127.0.0.1:9111/api/web/supercolliders/render_polyphonic',
            data=data,
            headers={'Content-Type':'application/json'},
            method='POST',
          )
          with urllib.request.urlopen(http_req, timeout=3600) as r:
            body = r.read()
          resp = json.loads(body.decode('utf-8'))
          with open('render_response.json', 'w', encoding='utf-8') as f:
            json.dump(resp, f, ensure_ascii=False, indent=2)
          if resp.get('error'):
            raise RuntimeError(f"polyphonic render failed: {resp['error']}")
          audio_b64 = resp.get('audio_data','')
          if ',' in audio_b64:
            audio_b64 = audio_b64.split(',',1)[1]
          if not audio_b64:
            raise RuntimeError('polyphonic render returned no audio_data; see render_response.json')
          wav = base64.b64decode(audio_b64.encode('utf-8'))
          if len(wav) <= 44 or wav[:4] != b'RIFF' or wav[8:12] != b'WAVE':
            raise RuntimeError(f'polyphonic render returned an invalid WAV ({len(wav)} bytes); see render_response.json')
          open('result.wav','wb').write(wav)
          print('result.wav written:', len(wav), 'bytes')
          PY

      - name: Stop server
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi
          docker logs voicevox-worker > voicevox-worker.log 2>&1 || true
          docker logs voicevox-engine > voicevox-engine.log 2>&1 || true
          docker rm -f voicevox-worker voicevox-engine || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polyphonic-${{ inputs.request_id || github.run_id }}
          path: |
            params.json
            result.json
            result.wav
            render_response.json
            server.log
            voicevox-worker.log
            voicevox-engine.log
