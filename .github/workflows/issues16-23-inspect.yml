name: issues16-23-inspect

on:
  push:
    branches:
      - fix/issues-16-23

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issues-16-23
      - name: Print target contexts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = {
            'src/controllers/time_series_controller.jl': [
              '_resolved_fixed_value_for_stream',
              '_fixed_area_band_low_for_stream',
              'DissonanceStmManager.commit!',
              'DissonanceStmManager.evaluate',
              'lifecycle_mgr',
              'stream_strength_target',
              'streamStrengths',
              'use_recent_position_weight',
              'debug_score_key',
              'debug_score_top_n',
              'debug_score',
              'debug_poly',
              'function generate()',
              'select_candidate_by_complexity_score',
            ],
            'src/voice/voice_token_generation.jl': [
              '_candidate_complexity_scores',
              'predictive_surprise',
              'combine_predictive_structural_scores',
            ],
            'src/polyphonic/polyphonic_cluster_manager.jl': [
              'function Manager(',
              'seed_as',
              'clusters = Dict',
              'clusters_to_timeline',
              'select_candidate_by_complexity_score',
            ],
            'src/config.jl': ['POLYPHONIC_BPM', 'MAX_NOTE_CANDIDATES'],
            'frontend/src/components/dialog/MusicGenerateDialog.vue': [
              '480', 'use_recent_position_weight', 'debug_score_key', 'debug_score_top_n', 'debug_score', 'debug_poly'
            ],
            'docs/generate_polyphonic.md': [
              '480', '240', 'streamStrengths', 'use_recent_position_weight', 'debug_score_key', 'debug_score_top_n', 'debug_score', 'debug_poly', 'initial_context_last_step', 'dissonance', 'voice token'
            ],
            'docs/generate.md': ['range_min', 'range_max', 'first_elements'],
            'docs/analyse.md': ['0件', '1件', 'min_window', '短']
          }

          for file, needles in targets.items():
            p = Path(file)
            print('\n' + '='*110)
            print(file)
            if not p.exists():
              print('MISSING')
              continue
            lines = p.read_text().splitlines()
            seen = set()
            for needle in needles:
              for i, line in enumerate(lines):
                if needle in line:
                  lo=max(0,i-14); hi=min(len(lines),i+25)
                  key=(lo,hi)
                  if key in seen: continue
                  seen.add(key)
                  print(f'\n--- needle={needle!r} line={i+1} context={lo+1}-{hi} ---')
                  for n in range(lo,hi):
                    print(f'{n+1:6d}: {lines[n]}')
          PY
