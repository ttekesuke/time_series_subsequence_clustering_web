name: Render Audio Manual Benchmark

on:
  push:
    branches:
      - benchmark/render-final

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GENIE_ENV: prod
      GENIE_HOST: 127.0.0.1
      GENIE_PORT: "19115"
      HOST: 127.0.0.1
      PORT: "19115"
      JULIA_NUM_THREADS: "auto"
      VOICEVOX_ENABLED: "true"
      VOICEVOX_URL: "http://127.0.0.1:9120"
      SC_RENDER_TIMEOUT_SECONDS: "3600"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.11.6"

      - name: Julia cache
        uses: julia-actions/cache@v2

      - name: Instantiate
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Install SuperCollider
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y supercollider

      - name: Start VOICEVOX services
        if: ${{ true }}
        shell: bash
        run: |
          set -euxo pipefail
          docker run -d --name voicevox-engine -p 50021:50021 \
            voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          docker build -t local-voicevox-worker -f voicevox_worker/Dockerfile .
          docker run -d --name voicevox-worker --network host \
            -e VOICEVOX_ENGINE_URL=http://127.0.0.1:50021 \
            -e VOICEVOX_SPEAKER=2 \
            -e VOICEVOX_RENDER_MODE=sing \
            -e VOICEVOX_SINGING_TEACHER=6000 \
            -e VOICEVOX_SINGER=3003 \
            -e VOICEVOX_WORKER_PORT=9120 \
            local-voicevox-worker
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:9120/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9120/health >/dev/null

      - name: Start Genie
        shell: bash
        run: |
          set -euxo pipefail
          julia --project=. scripts/start_server.jl > /tmp/render-benchmark-server.log 2>&1 &
          echo $! > /tmp/render-benchmark-server.pid

          for i in $(seq 1 600); do
            if ! kill -0 "$(cat /tmp/render-benchmark-server.pid)" 2>/dev/null; then
              echo "Server exited early"
              tail -n 300 /tmp/render-benchmark-server.log || true
              exit 1
            fi
            if curl -fsS http://127.0.0.1:${GENIE_PORT}/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:${GENIE_PORT}/api/health >/dev/null

      - name: Run render benchmark
        shell: bash
        env:
          BENCH_MODE: "voice"
          BENCH_STEPS: "500"
          BENCH_BPM: "240"
          BENCH_TEXT: "あ"
          BENCH_TIMEOUT_SECONDS: "3600"
        run: |
          set -euo pipefail
          python3 scripts/benchmark_render_audio_http.py \
            --base-url http://127.0.0.1:${GENIE_PORT} \
            --mode "$BENCH_MODE" \
            --steps "$BENCH_STEPS" \
            --bpm "$BENCH_BPM" \
            --text "$BENCH_TEXT" \
            --timeout "$BENCH_TIMEOUT_SECONDS" \
            2>&1 | tee /tmp/render-audio-benchmark.log

      - name: Save benchmark summary
        if: always()
        shell: bash
        env:
          BENCH_MODE: ${{ inputs.mode }}
          BENCH_STEPS: ${{ inputs.steps }}
          BENCH_BPM: ${{ inputs.bpm }}
        run: |
          {
            echo "## Render audio manual benchmark"
            echo
            echo "- mode: \`$BENCH_MODE\`"
            echo "- steps: \`$BENCH_STEPS\`"
            echo "- bpm: \`$BENCH_BPM\`"
            echo "- commit: \`$GITHUB_SHA\`"
            echo
            if [ -f /tmp/render-audio-benchmark.log ]; then
              echo '~~~text'
              grep 'render_audio_benchmark=' /tmp/render-audio-benchmark.log || true
              echo '~~~'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Collect service logs
        if: always()
        shell: bash
        run: |
          docker logs voicevox-worker > /tmp/voicevox-worker.log 2>&1 || true
          docker logs voicevox-engine > /tmp/voicevox-engine.log 2>&1 || true

      - name: Stop services
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/render-benchmark-server.pid ]; then
            kill "$(cat /tmp/render-benchmark-server.pid)" 2>/dev/null || true
          fi
          docker rm -f voicevox-worker voicevox-engine >/dev/null 2>&1 || true

      - name: Upload benchmark logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-audio-benchmark-${{ github.run_id }}
          path: |
            /tmp/render-audio-benchmark.log
            /tmp/render-benchmark-server.log
            /tmp/voicevox-worker.log
            /tmp/voicevox-engine.log
          if-no-files-found: warn
