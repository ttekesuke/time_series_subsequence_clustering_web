name: issue14-transaction-safety-tests

on:
  push:
    branches:
      - fix/issue-14-transaction-safety

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-14-transaction-safety
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11.6"
      - uses: julia-actions/cache@v2
      - name: Instantiate app
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run transaction safety tests
        run: |
          julia --project=. -e '
            ENV["GENIE_ENV"] = "test"
            push!(LOAD_PATH, abspath("src"))
            using Genie
            Genie.loadapp()
            using Main.TimeseriesClusteringAPI, Test, Logging
            Logging.global_logger(NullLogger())
            include("test/transaction_safety.jl")
          '
