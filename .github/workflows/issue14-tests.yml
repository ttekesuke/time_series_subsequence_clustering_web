name: issue14-transaction-safety-tests

on:
  push:
    branches:
      - fix/issue-14-transaction-safety

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-14-transaction-safety
          fetch-depth: 0
      - name: Apply pending failure-context fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/controllers/time_series_controller.jl')
          lines = p.read_text().splitlines()
          start = lines.index('function select_best_values_for_dimension_greedy(')
          end = lines.index('# generate_polyphonic (main)', start)
          operation = '          operation="simulate_candidate",'
          stream = '          stream_id=(stream_idx <= length(actives) ? actives[stream_idx].id : nothing),'
          dimension = '          dimension=get(trace_context, :dimension, nothing),'
          hits = [i for i in range(start, end) if lines[i] == operation and i + 1 < end and lines[i + 1] in (stream, dimension)]
          if len(hits) != 1:
              raise SystemExit(f'expected one greedy trace block, found {len(hits)}')
          i = hits[0]
          if lines[i + 1] == stream:
              lines.insert(i + 1, dimension)
              p.write_text('\n'.join(lines) + '\n')
          PY
          rm -f .github/workflows/issue14-context-fix.yml .github/workflows/issue14-context-fix-v2.yml
          if ! git diff --quiet -- src/controllers/time_series_controller.jl .github/workflows/issue14-context-fix.yml .github/workflows/issue14-context-fix-v2.yml; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A src/controllers/time_series_controller.jl .github/workflows/issue14-context-fix.yml .github/workflows/issue14-context-fix-v2.yml
            git diff --cached --check
            git commit -m "fix: preserve generation failure dimension"
            git push origin HEAD:fix/issue-14-transaction-safety
          fi
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11.6"
      - uses: julia-actions/cache@v2
      - name: Instantiate app
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run transaction safety tests
        run: |
          julia --project=. -e '
            ENV["GENIE_ENV"] = "test"
            push!(LOAD_PATH, abspath("src"))
            using Genie
            Genie.loadapp()
            using Main.TimeseriesClusteringAPI, Test, Logging
            Logging.global_logger(NullLogger())
            include("test/transaction_safety.jl")
          '
