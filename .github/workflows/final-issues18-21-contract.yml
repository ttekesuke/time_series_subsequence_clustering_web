name: final-issues18-21-contract

on:
  push:
    branches:
      - fix/issues-16-23

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issues-16-23
          fetch-depth: 0

      - name: Remove inert debug parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/controllers/time_series_controller.jl')
          text = path.read_text()
          start = text.index('  debug_poly = false\n', text.index('function generate_polyphonic()'))
          end_marker = '  # ----------------------------------------------------------\n  # Params\n'
          end = text.index(end_marker, start)
          region = text[start:end]
          if 'get(gp, "debug_poly", false)' not in region or 'get(gp, "debug_score", false)' not in region:
              raise SystemExit('unexpected debug parser region')
          path.write_text(text[:start] + text[end:])
          PY
          git diff --check

      - name: Add lifecycle regression
        run: |
          cat > test/issues_18_lifecycle_regression.jl <<'JULIA'
          using Test

          const LifecycleMSM = Main.TimeseriesClusteringAPI.MultiStreamManager
          const LifecycleConfig = Main.TimeseriesClusteringAPI.Config

          function volume_lifecycle_manager()
            manager = LifecycleMSM.Manager(
              [[0.2, 0.8], [0.2, 0.8], [0.2, 0.8]],
              0.3,
              2;
              value_range=LifecycleConfig.VOL_STEPS,
              track_presence=true,
            )
            @test all(0.0 <= LifecycleMSM.get_stream_strength(manager, id) <= 1.0 for id in manager.active_ids)
            return manager
          end

          @testset "#18 volume lifecycle remains presence-based for generated and fixed volume" begin
            for policy in (:generated, :fixed)
              manager = volume_lifecycle_manager()

              decrease = LifecycleMSM.build_stream_lifecycle_plan(manager, 1; target=0.2, spread=0.0)
              @test decrease.deactivate_ids == [1]
              @test decrease.active_ids == [2]
              LifecycleMSM.apply_stream_lifecycle_plan!(manager, decrease)

              increase = LifecycleMSM.build_stream_lifecycle_plan(manager, 2; target=0.2, spread=0.0)
              @test increase.revive_ids == [1]
              @test isempty(increase.fork_pairs)
              LifecycleMSM.apply_stream_lifecycle_plan!(manager, increase)
              @test Set(manager.active_ids) == Set([1, 2])

              fork_plan = LifecycleMSM.build_stream_lifecycle_plan(manager, 3; target=0.8, spread=0.0)
              @test isempty(fork_plan.revive_ids)
              @test length(fork_plan.fork_pairs) == 1
              @test fork_plan.fork_pairs[1][1] == 2
              LifecycleMSM.apply_stream_lifecycle_plan!(manager, fork_plan)
              @test length(manager.active_ids) == 3

              committed = policy == :generated ? [0.9, 0.2, 0.9] : [0.6, 0.6, 0.6]
              LifecycleMSM.commit_state!(manager, committed)
              @test all(0.0 <= LifecycleMSM.get_stream_strength(manager, id) <= 1.0 for id in manager.active_ids)
            end
          end
          JULIA
          git diff --check

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11.6'

      - name: Instantiate Julia
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run issue regression suites
        run: |
          julia --project=. -e '
            ENV["GENIE_ENV"] = "test"
            push!(LOAD_PATH, abspath("src"))
            using Genie
            Genie.loadapp()
            using Main.TimeseriesClusteringAPI, Test
            include("test/issues_16_23_regressions.jl")
            include("test/issues_18_lifecycle_regression.jl")
          '

      - name: Assert no-op parser is gone
        run: |
          python3 - <<'PY'
          from pathlib import Path
          controller = Path('src/controllers/time_series_controller.jl').read_text()
          dialog = Path('frontend/src/components/dialog/MusicGenerateDialog.vue').read_text()
          assert 'debug_poly =' not in controller
          assert 'get(gp, "debug_score", false)' not in controller
          assert 'use_recent_position_weight:' not in dialog
          assert 'debug_score_key:' not in dialog
          assert 'debug_score_top_n:' not in dialog
          PY

      - name: Commit verified cleanup and remove one-shot workflow
        run: |
          rm -f .github/workflows/final-issues18-21-contract.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test: lock lifecycle and no-op contracts'
          git push origin HEAD:fix/issues-16-23
