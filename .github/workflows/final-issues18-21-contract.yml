name: final-issues18-21-contract

on:
  push:
    branches:
      - fix/issues-16-23

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issues-16-23
          fetch-depth: 0

      - name: Apply final contract cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          controller_path = Path('src/controllers/time_series_controller.jl')
          controller = controller_path.read_text()
          debug_block = '''  debug_poly = false
          try
            debug_poly = get(gp, "debug_poly", false) == true || get(gp, "debug_score", false) == true || get(ENV, "ZIP_DEBUG_POLY", "0") == "1"
          catch
            debug_poly = get(ENV, "ZIP_DEBUG_POLY", "0") == "1"
          end

          '''
          if controller.count(debug_block) != 1:
              raise SystemExit(f'expected one inert debug block, found {controller.count(debug_block)}')
          controller_path.write_text(controller.replace(debug_block, '', 1))

          test_path = Path('test/issues_16_23_regressions.jl')
          test = test_path.read_text()
          source_anchor = '  @test !occursin("debug_score_top_n:", dialog)\n'
          if test.count(source_anchor) != 1:
              raise SystemExit('source contract anchor missing')
          test = test.replace(
              source_anchor,
              source_anchor + '  @test !occursin("debug_poly =", controller)\n  @test !occursin("get(gp, \\"debug_score\\"", controller)\n',
              1,
          )
          lifecycle_test = r'''

          @testset "#18 volume lifecycle supports deactivate/revive/fork for generated and fixed policies" begin
            function volume_lifecycle_manager()
              manager = IssuesMSM.Manager(
                [[0.2, 0.8], [0.2, 0.8], [0.2, 0.8]],
                0.3,
                2;
                value_range=IssuesConfig.VOL_STEPS,
                track_presence=true,
              )
              @test all(0.0 <= IssuesMSM.get_stream_strength(manager, id) <= 1.0 for id in manager.active_ids)
              return manager
            end

            for policy in (:generated, :fixed)
              manager = volume_lifecycle_manager()

              decrease = IssuesMSM.build_stream_lifecycle_plan(manager, 1; target=0.2, spread=0.0)
              @test length(decrease.deactivate_ids) == 1
              @test decrease.deactivate_ids == [1]
              IssuesMSM.apply_stream_lifecycle_plan!(manager, decrease)
              @test decrease.active_ids == [2]

              increase = IssuesMSM.build_stream_lifecycle_plan(manager, 2; target=0.2, spread=0.0)
              @test increase.revive_ids == [1]
              @test isempty(increase.fork_pairs)
              IssuesMSM.apply_stream_lifecycle_plan!(manager, increase)
              @test Set(increase.active_ids) == Set([1, 2])

              fork = IssuesMSM.build_stream_lifecycle_plan(manager, 3; target=0.8, spread=0.0)
              @test isempty(fork.revive_ids)
              @test length(fork.fork_pairs) == 1
              @test fork.fork_pairs[1][2] > 2
              IssuesMSM.apply_stream_lifecycle_plan!(manager, fork)
              @test length(manager.active_ids) == 3

              # The policy changes how volume values are selected, not the
              # lifecycle coordinate system: both paths remain 0..1 presence.
              committed = policy == :generated ? [0.9, 0.2, 0.9] : [0.6, 0.6, 0.6]
              IssuesMSM.commit_state!(manager, committed)
              @test all(0.0 <= IssuesMSM.get_stream_strength(manager, id) <= 1.0 for id in manager.active_ids)
            end
          end
          '''
          if '#18 volume lifecycle supports deactivate/revive/fork' in test:
              raise SystemExit('lifecycle regression already exists')
          test_path.write_text(test + lifecycle_test)
          PY
          git diff --check

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11.6'

      - name: Instantiate Julia
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run issue regression suite
        run: |
          julia --project=. -e '
            ENV["GENIE_ENV"] = "test"
            push!(LOAD_PATH, abspath("src"))
            using Genie
            Genie.loadapp()
            using Main.TimeseriesClusteringAPI, Test
            include("test/issues_16_23_regressions.jl")
          '

      - name: Commit verified cleanup and remove one-shot workflow
        run: |
          rm -f .github/workflows/final-issues18-21-contract.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test: lock lifecycle and no-op contracts'
          git push origin HEAD:fix/issues-16-23
